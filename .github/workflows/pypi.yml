name: Upload Python Package to PyPI

on:
  release:
    types: [published]
  workflow_dispatch: # allow manual re-publish after a version/CI fix

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Required for trusted publishing
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for hatch-vcs to get version from git tags

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Setup Python
        run: uv python install 3.11

      # NOTE: do NOT run `uv sync` before `uv build`. uv sync's editable-install
      # version detection yields next.dev0 (e.g. 0.3.1.dev0) at a clean tag,
      # poisoning the wheel version. `uv build` alone derives the correct tag
      # version (e.g. 0.3.0) from git via hatch-vcs.
      - name: Build package
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
